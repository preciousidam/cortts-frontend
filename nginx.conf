# nginx.conf
server {
  listen 80;
  server_name _;

  # Root is your Expo export
  root /usr/share/nginx/html;

  # Gzip for text assets
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  gzip_min_length 1024;

  # Make sure the right MIME types are used
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Serve static assets with long cache
  location ^~ /assets/ {
    add_header Access-Control-Allow-Origin * always;   # fonts may be loaded cross-origin
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Expo router assets
  location ^~ /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Favicon (small cache)
  location = /favicon.ico {
    add_header Cache-Control "public, max-age=86400";
    try_files /favicon.ico =404;
  }

  # Everything else → SPA fallback (index.html)
  location / {
    # Don’t cache the HTML shell
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}